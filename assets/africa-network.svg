<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 520" fill="none">
  <!-- Africa continent silhouette -->
  <path d="M130 14 C98 16 64 30 48 58 C32 86 30 114 35 141
           C22 158 16 180 20 207 C10 225 8 248 17 268
           C5 293 8 321 22 344 C34 371 57 399 85 421
           C107 443 135 465 162 481 C179 492 196 503 213 498
           C230 490 241 470 246 448 C258 424 270 397 279 369
           C291 340 299 309 302 278 C307 249 304 221 295 197
           C288 175 275 156 270 133 C268 110 270 88 264 65
           C257 41 237 19 215 12 C192 5 162 7 130 14Z"
        fill="rgba(245,166,35,0.06)" stroke="rgba(245,166,35,0.22)" stroke-width="1.5"/>
  <!-- Horn/Somali peninsula -->
  <path d="M246 448 C254 467 265 480 276 475 C287 469 293 451 290 433
           C287 416 280 402 274 391 L246 448Z"
        fill="rgba(245,166,35,0.06)"/>
  <!-- Madagascar -->
  <path d="M296 278 C292 265 287 278 285 293 C283 308 286 324 290 331
           C295 324 300 308 296 278Z"
        fill="rgba(245,166,35,0.06)" stroke="rgba(245,166,35,0.12)" stroke-width="0.8"/>

  <!-- ── NETWORK NODES (African tech hubs) ── -->
  <!-- Lagos -->
  <circle cx="118" cy="258" r="6" fill="#f5a623" opacity="0.95"/>
  <circle cx="118" cy="258" r="13" fill="#f5a623" opacity="0.13"/>
  <circle cx="118" cy="258" r="22" fill="#f5a623" opacity="0.05"/>
  <!-- Nairobi -->
  <circle cx="222" cy="302" r="6" fill="#1de8c8" opacity="0.95"/>
  <circle cx="222" cy="302" r="13" fill="#1de8c8" opacity="0.13"/>
  <circle cx="222" cy="302" r="22" fill="#1de8c8" opacity="0.05"/>
  <!-- Cairo -->
  <circle cx="198" cy="108" r="4.5" fill="#f5a623" opacity="0.85"/>
  <circle cx="198" cy="108" r="10" fill="#f5a623" opacity="0.1"/>
  <!-- Johannesburg -->
  <circle cx="186" cy="418" r="4.5" fill="#1de8c8" opacity="0.85"/>
  <circle cx="186" cy="418" r="10" fill="#1de8c8" opacity="0.1"/>
