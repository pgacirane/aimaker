  <line x1="198" y1="108" x2="232" y2="258" stroke="#1de8c8" stroke-width="0.85" opacity="0.28" stroke-dasharray="5,4"/>
  <line x1="72"  y1="198" x2="118" y2="258" stroke="#f5a623" stroke-width="0.85" opacity="0.25" stroke-dasharray="4,4"/>
  <line x1="118" y1="258" x2="108" y2="276" stroke="#f5a623" stroke-width="0.85" opacity="0.25" stroke-dasharray="3,4"/>
  <line x1="118" y1="258" x2="208" y2="312" stroke="#f5a623" stroke-width="0.85" opacity="0.3"  stroke-dasharray="5,4"/>
  <line x1="148" y1="228" x2="118" y2="258" stroke="#1de8c8" stroke-width="0.8"  opacity="0.22" stroke-dasharray="4,4"/>
  <line x1="232" y1="258" x2="222" y2="302" stroke="#1de8c8" stroke-width="0.85" opacity="0.35" stroke-dasharray="5,4"/>
  <line x1="222" y1="302" x2="234" y2="338" stroke="#1de8c8" stroke-width="0.8"  opacity="0.3"  stroke-dasharray="4,4"/>
  <line x1="208" y1="312" x2="222" y2="302" stroke="#1de8c8" stroke-width="0.8"  opacity="0.3"  stroke-dasharray="3,4"/>
  <line x1="222" y1="302" x2="186" y2="418" stroke="#1de8c8" stroke-width="0.8"  opacity="0.28" stroke-dasharray="5,4"/>
  <line x1="234" y1="338" x2="186" y2="418" stroke="#f5a623" stroke-width="0.75" opacity="0.22" stroke-dasharray="4,5"/>
  <line x1="118" y1="258" x2="232" y2="258" stroke="#f5a623" stroke-width="0.65" opacity="0.18" stroke-dasharray="6,5"/>

  <!-- ── CITY LABELS ── -->
  <text x="124" y="254" font-family="monospace" font-size="7.5" fill="#f5a623" opacity="0.75" letter-spacing="0.8">Lagos</text>
  <text x="228" y="298" font-family="monospace" font-size="7.5" fill="#1de8c8" opacity="0.75" letter-spacing="0.8">Nairobi</text>
  <text x="203" y="103" font-family="monospace" font-size="7"   fill="#f5a623" opacity="0.65">Cairo</text>
  <text x="191" y="413" font-family="monospace" font-size="7"   fill="#1de8c8" opacity="0.65">Jo'burg</text>
  <text x="213" y="308" font-family="monospace" font-size="6.5" fill="#f5a623" opacity="0.7">Kigali</text>
