  <circle cx="102" cy="96"  r="3.5" fill="#f5a623" opacity="0.75"/>
  <!-- Accra -->
  <circle cx="108" cy="276" r="3.5" fill="#f5a623" opacity="0.7"/>
  <!-- Addis Ababa -->
  <circle cx="232" cy="258" r="3.5" fill="#1de8c8" opacity="0.75"/>
  <!-- Dar es Salaam -->
