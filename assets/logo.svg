<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0095ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="40" cy="40" r="36" stroke="url(#lg)" stroke-width="2.5" fill="none" opacity="0.6"/>
  <!-- Inner signal rings -->
  <circle cx="40" cy="40" r="26" stroke="url(#lg)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Africa-continent dot cluster (simplified) -->
  <circle cx="40" cy="38" r="9" fill="url(#lg)" opacity="0.9"/>
  <!-- Signal arcs top-right -->
  <path d="M52 22 Q60 30 58 42" stroke="#00e5ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M56 18 Q68 28 66 46" stroke="#0095ff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.45"/>
  <!-- Dot center -->
  <circle cx="40" cy="38" r="4" fill="#fff"/>
  <!-- Network nodes -->
  <circle cx="28" cy="28" r="2.5" fill="#0095ff"/>
  <circle cx="52" cy="30" r="2.5" fill="#0095ff"/>
  <circle cx="30" cy="52" r="2.5" fill="#00e5ff"/>
  <circle cx="50" cy="52" r="2.5" fill="#00e5ff"/>
  <!-- Connectors -->
  <line x1="28" y1="28" x2="40" y2="38" stroke="#0095ff" stroke-width="1" opacity="0.5"/>
  <line x1="52" y1="30" x2="40" y2="38" stroke="#0095ff" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="52" x2="40" y2="38" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="52" x2="40" y2="38" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
</svg>
