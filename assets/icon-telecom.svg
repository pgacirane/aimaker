<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="13" fill="rgba(245,166,35,0.08)"/>
  <!-- tower mast -->
  <path d="M32 10 L26 54 M32 10 L38 54" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <!-- cross braces -->
  <line x1="27.5" y1="26" x2="36.5" y2="26" stroke="#f5a623" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="27"   y1="36" x2="37"   y2="36" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="26.5" y1="46" x2="37.5" y2="46" stroke="#f5a623" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <!-- signal arcs left -->
  <path d="M22 17 Q18 22 22 27" stroke="#1de8c8" stroke-width="2"   stroke-linecap="round" fill="none"/>
  <path d="M18 13 Q12 22 18 31" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- signal arcs right -->
  <path d="M42 17 Q46 22 42 27" stroke="#1de8c8" stroke-width="2"   stroke-linecap="round" fill="none"/>
  <path d="M46 13 Q52 22 46 31" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- tip dot -->
  <circle cx="32" cy="10" r="3" fill="#f5a623"/>
  <!-- base -->
  <line x1="20" y1="54" x2="44" y2="54" stroke="#f5a623" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
</svg>
