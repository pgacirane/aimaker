<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="rgba(245,166,35,0.08)"/>
  <!-- circuit board base -->
  <rect x="16" y="18" width="32" height="24" rx="3" stroke="#f5a623" stroke-width="1.8"/>
  <!-- chip in center -->
  <rect x="24" y="24" width="16" height="12" rx="2" fill="rgba(245,166,35,0.15)" stroke="#f5a623" stroke-width="1.5"/>
  <!-- pins left -->
  <line x1="16" y1="24" x2="10" y2="24" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="10" y2="28" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="10" y2="32" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="36" x2="10" y2="36" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round"/>
  <!-- pins right -->
  <line x1="48" y1="24" x2="54" y2="24" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="28" x2="54" y2="28" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="54" y2="32" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="36" x2="54" y2="36" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round"/>
  <!-- wifi signal top -->
  <path d="M26 20 Q32 14 38 20" stroke="#1de8c8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M23 17 Q32 9 41 17" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- dot center chip -->
  <circle cx="32" cy="30" r="2" fill="#f5a623"/>
</svg>
