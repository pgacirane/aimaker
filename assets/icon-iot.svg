<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="13" fill="rgba(29,232,200,0.07)"/>
  <!-- PCB outline -->
  <rect x="14" y="20" width="36" height="24" rx="3" stroke="#1de8c8" stroke-width="1.8"/>
  <!-- chip centre -->
  <rect x="23" y="26" width="18" height="12" rx="2" fill="rgba(29,232,200,0.12)" stroke="#1de8c8" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2.2" fill="#1de8c8"/>
  <!-- pins left -->
  <line x1="14" y1="25" x2="8"  y2="25" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="30" x2="8"  y2="30" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="35" x2="8"  y2="35" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="40" x2="8"  y2="40" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- pins right -->
  <line x1="50" y1="25" x2="56" y2="25" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="30" x2="56" y2="30" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="35" x2="56" y2="35" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="56" y2="40" stroke="#1de8c8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- wifi above -->
  <path d="M25 18 Q32 12 39 18" stroke="#f5a623" stroke-width="1.9" stroke-linecap="round" fill="none"/>
  <path d="M21 14 Q32  7 43 14" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
