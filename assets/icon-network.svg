<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="13" fill="rgba(245,166,35,0.08)"/>
  <!-- server rack units -->
  <rect x="10" y="13" width="32" height="9"  rx="2" stroke="#f5a623" stroke-width="1.8"/>
  <rect x="10" y="26" width="32" height="9"  rx="2" stroke="#f5a623" stroke-width="1.8"/>
  <rect x="10" y="39" width="32" height="9"  rx="2" stroke="#f5a623" stroke-width="1.8"/>
  <!-- status dots -->
  <circle cx="37" cy="17.5" r="2.2" fill="#1de8c8" opacity="0.85"/>
  <circle cx="37" cy="30.5" r="2.2" fill="#1de8c8" opacity="0.65"/>
  <circle cx="37" cy="43.5" r="2.2" fill="#f5a623" opacity="0.65"/>
