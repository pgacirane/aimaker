  <line x1="14" y1="17.5" x2="28" y2="17.5" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <line x1="14" y1="30.5" x2="28" y2="30.5" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <line x1="14" y1="43.5" x2="28" y2="43.5" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <!-- wireless signal right -->
